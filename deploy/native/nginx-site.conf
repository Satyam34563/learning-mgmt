# nginx site for the portal on a native (no Docker) server.
# setup-root.sh fills in __DOMAIN__ and __APP__ and installs it as /etc/nginx/sites-available/online-learning;
# certbot then adds the HTTPS (443) server block.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  root __APP__/client/dist;
  index index.html;

  client_max_body_size 30m; # keep >= MAX_UPLOAD_MB

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # bulk imports
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Browsers ask for /favicon.ico on their own; answer with the school logo
  location = /favicon.ico {
    proxy_pass http://127.0.0.1:4000/api/school/icon;
    proxy_set_header Host $host;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing
  location / {
    try_files $uri /index.html;
  }
}
