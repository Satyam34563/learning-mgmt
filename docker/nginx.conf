# Serves the React build and proxies the API, so the app and API share one origin (cookies just work).
# Put TLS in front of this (Caddy / Certbot / your host's load balancer) or extend with a 443 server block.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 30m; # keep >= MAX_UPLOAD_MB

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Browsers ask for /favicon.ico on their own; answer with the school logo
  location = /favicon.ico {
    proxy_pass http://api:4000/api/school/icon;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing
  location / {
    try_files $uri /index.html;
  }
}
