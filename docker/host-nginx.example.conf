# Host Nginx in front of the portal's Docker stack (which listens on 127.0.0.1:8080).
# Copy to /etc/nginx/sites-available/dlcs-lectures, symlink into sites-enabled, then
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dlcs.lectures.managemyschools.in      # adds HTTPS + the 80->443 redirect
server {
  listen 80;
  server_name dlcs.lectures.managemyschools.in;

  client_max_body_size 30m; # keep >= MAX_UPLOAD_MB

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
