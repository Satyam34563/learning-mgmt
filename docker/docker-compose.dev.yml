# Local development database. Data persists in the `mongo-dev-data` volume.
name: lectures-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
